# Generate the Xcode project with:  cd ios && xcodegen
name: Krida
options:
  bundleIdPrefix: com.ardeman
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # User-facing text is Indonesian (Localizable.xcstrings).
  developmentLanguage: id

packages:
  # AdMob; brings Google's User Messaging Platform (consent form) along.
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 13.12.0

targets:
  Krida:
    type: application
    platform: iOS
    sources:
      - path: Krida
    dependencies:
      - package: GoogleMobileAds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ardeman.krida
        DEVELOPMENT_TEAM: B36A8H9S8E
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: Krida
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        # Kotlin Multiplatform "Shared" framework built by the pre-build script below.
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework Shared"
        # Shared is built for arm64 simulators only (no iosX64 target), so skip the Intel slice.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Smaller binary
        DEAD_CODE_STRIPPING: YES
        SWIFT_OPTIMIZATION_LEVEL: "-Osize"
    preBuildScripts:
      - name: Build Shared framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode -PsharedOnly=true
    info:
      path: Krida/Info.plist
      properties:
        CFBundleDisplayName: Krida
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBluetoothAlwaysUsageDescription: "Krida memakai Bluetooth untuk main bareng teman di dekatmu tanpa internet."
        NSLocalNetworkUsageDescription: "Krida mencari teman di Wi-Fi yang sama untuk main bareng."
        # AdMob app id: Google's TEST id until the real one from the AdMob console (see Ads/AdIds.swift).
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        # Google's own SKAdNetwork id; add the third-party buyer ids from Google's list before release.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
        NSBonjourServices:
          - _krida._tcp
        CFBundleURLTypes:
          - CFBundleURLName: com.ardeman.krida.join
            CFBundleURLSchemes:
              - krida
