# Tests relay/ against a local dev relay, deploys it to Cloudflare Workers, then runs the
# same smoke test against the live relay. Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# A deploy restarts the room objects and drops open games; once online play ships, remove
# the push trigger and deploy by hand (Actions → Deploy relay → Run workflow).
name: Deploy relay

on:
  push:
    branches: [main]
    # Only what ends up in the deployed Worker. Docs, the smoke test script and other
    # files in relay/ don't deploy; run the workflow by hand if one of them needs it.
    paths:
      - "relay/src/**"
      - "relay/wrangler.toml"
      - "relay/package.json"
      - "relay/package-lock.json"
      - "relay/tsconfig.json"
      - ".github/workflows/relay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test:match

      - name: Smoke test against a local relay
        run: |
          npx wrangler dev --port 8787 > dev.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8787/ && break; sleep 1; done
          npm run smoke || { cat dev.log; exit 1; }
          npm run smoke:group || { cat dev.log; exit 1; }
          node scripts/smoke-public.mjs ws://localhost:8787 || { cat dev.log; exit 1; }

      - name: Account smoke test (own local relay, mocked Apple and Google)
        run: npm run smoke:accounts

      - name: Deploy
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log

      - name: Smoke test against the live relay
        run: |
          url=https://krida-relay.ardeman.com
          echo "Relay: $url"
          # A new custom domain may need time for DNS and its certificate.
          for i in $(seq 1 60); do curl -sf "$url/" && break; sleep 5; done
          ws="${url/https:/wss:}"
          node scripts/smoke.mjs "$ws"
          npm run smoke:group -- "$ws"
          npm run smoke:public -- "$ws"
