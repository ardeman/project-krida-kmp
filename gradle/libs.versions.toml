[versions]
kotlin = "2.2.21"
agp = "8.13.0"
serialization = "1.9.0"
compose-bom = "2025.09.00"
activity-compose = "1.10.1"
filament = "1.66.0"
play-services-ads = "25.5.0"
ump = "4.0.0"
billing = "9.1.0"
fragment = "1.9.1"
code-scanner = "16.1.0"
okhttp = "4.12.0"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
filament-android = { module = "com.google.android.filament:filament-android", version.ref = "filament" }
filament-gltfio = { module = "com.google.android.filament:gltfio-android", version.ref = "filament" }
filament-utils = { module = "com.google.android.filament:filament-utils-android", version.ref = "filament" }
play-services-ads = { module = "com.google.android.gms:play-services-ads", version.ref = "play-services-ads" }
ump = { module = "com.google.android.ump:user-messaging-platform", version.ref = "ump" }
billing = { module = "com.android.billingclient:billing-ktx", version.ref = "billing" }
fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
code-scanner = { module = "com.google.android.gms:play-services-code-scanner", version.ref = "code-scanner" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
