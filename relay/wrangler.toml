name = "krida-relay"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true
routes = [{ pattern = "krida-relay.ardeman.com", custom_domain = true }]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "MATCHMAKERS"
class_name = "Matchmaker"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Matchmaker"]

[[durable_objects.bindings]]
name = "GROUP_MATCHMAKERS"
class_name = "GroupMatchmaker"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["GroupMatchmaker"]

[[durable_objects.bindings]]
name = "INBOXES"
class_name = "Inbox"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Inbox"]

# Accounts (src/accounts.ts). Without a database_id, wrangler creates the database on the
# first deploy; the tables are created by the Worker itself. Secrets, set once with
# `wrangler secret put`: GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, and for revoking Apple
# access on account deletion APPLE_TEAM_ID, APPLE_KEY_ID, APPLE_PRIVATE_KEY. For invite
# notifications on iPhones (src/push.ts): APPLE_TEAM_ID, APNS_KEY_ID, APNS_PRIVATE_KEY.
[[d1_databases]]
binding = "DB"
database_name = "krida"

[vars]
APPLE_BUNDLE_ID = "com.ardeman.krida"
