name = "krida-relay"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true
routes = [{ pattern = "krida-relay.ardeman.com", custom_domain = true }]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "MATCHMAKERS"
class_name = "Matchmaker"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Matchmaker"]

[[durable_objects.bindings]]
name = "GROUP_MATCHMAKERS"
class_name = "GroupMatchmaker"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["GroupMatchmaker"]
